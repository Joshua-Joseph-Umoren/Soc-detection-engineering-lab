# Wazuh Log Pipeline Configuration
# Forwards Wazuh alerts to centralized analysis

<source>
  @type tail
  path /var/ossec/logs/alerts/alerts.json
  pos_file /var/log/fluentd/wazuh-alerts.pos
  tag wazuh.alerts
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S
</source>

<filter wazuh.alerts>
  @type grep
  <regexp>
    key rule.level
    pattern /^(1[0-9]|[7-9])$/
  </regexp>
</filter>

<filter wazuh.alerts>
  @type record_transformer
  <record>
    environment aws-soc-lab
    log_source wazuh-manager
    mitre_technique ${record.dig("rule", "mitre", "id")}
  </record>
</filter>

<match wazuh.alerts>
  @type stdout
  # Replace with your SIEM/Elasticsearch output:
  # @type elasticsearch
  # host localhost
  # port 9200
  # index_name wazuh-alerts
</match>
