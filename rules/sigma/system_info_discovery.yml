title: System Information Discovery
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: experimental
description: Detects system information gathering via sysinfo or similar tools
author: Joshua Umoren
date: 2026/09/01
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\sysinfo.exe'
            - '\systeminfo.exe'
            - '\wmic.exe'
        CommandLine|contains|any:
            - 'os'
            - 'computersystem'
            - 'sysinfo'
    condition: selection
falsepositives:
    - Legitimate admin activity
level: medium
tags:
    - attack.discovery
    - attack.t1082
