title: Process Discovery via Tasklist
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: Detects process enumeration using tasklist or Get-Process commands
author: Joshua Umoren
date: 2026/09/01
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\tasklist.exe'
            - '\powershell.exe'
        CommandLine|contains:
            - 'Get-Process'
            - 'tasklist'
    condition: selection
falsepositives:
    - Legitimate admin activity
level: medium
tags:
    - attack.discovery
    - attack.t1057
